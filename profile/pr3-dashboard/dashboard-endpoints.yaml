openapi: 3.1.0
info:
  title: Sprint Dashboard API (PR-3 Scaffold)
  version: 0.1.0
paths:
  /sprints/{sprintId}/calendar:
    get:
      summary: Get sprint calendar payload
      parameters:
        - in: path
          name: sprintId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Calendar payload

  /sprints/{sprintId}/metrics:
    get:
      summary: Get value metrics for current sprint plan
      parameters:
        - in: path
          name: sprintId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Value metrics payload

  /sprints/{sprintId}/items/{itemId}:
    patch:
      summary: Override recommendation fields for one plan item
      parameters:
        - in: path
          name: sprintId
          required: true
          schema:
            type: string
        - in: path
          name: itemId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Plan item updated

  /sprints/{sprintId}/replan:
    post:
      summary: Re-run planner while preserving user overrides
      parameters:
        - in: path
          name: sprintId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Updated plan + metrics
