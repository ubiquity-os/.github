name: Plugin Health Monitor

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run unit tests
        run: |
          node --test profile/scripts/plugin-health-monitor.test.mjs

      - name: Run monitor
        id: monitor
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_ORG: ubiquity-os-marketplace
          ALERT_REPO: ${{ github.repository }}
          ALERT_ISSUE_NUMBER: "12"
          ALERT_TAGS: "@0x4007 @gentlementlegen"
          FAILURE_STREAK_THRESHOLD: "10"
          OUTPUT_PATH: profile/plugin-health-report.json
        run: |
          node profile/scripts/plugin-health-monitor.mjs

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-health-report
          path: profile/plugin-health-report.json
          if-no-files-found: ignore

      - name: Publish run summary
        if: always()
        shell: bash
        run: |
          if [ ! -f profile/plugin-health-report.json ]; then
            echo "Plugin Health Monitor report missing" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          node <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('profile/plugin-health-report.json', 'utf8'));
          const summaryPath = process.env.GITHUB_STEP_SUMMARY;
          if (!summaryPath) process.exit(0);

          const lines = [];
          lines.push('### Plugin Health Monitor');
          lines.push('');
          lines.push(`- Repositories scanned: ${report.repositories_scanned ?? 0}`);
          lines.push(`- Findings: ${report.findings_count ?? 0}`);
          lines.push(`- Threshold: ${report.threshold ?? 0}`);
          if (report.alert_comment_url) {
            lines.push(`- Alert comment: ${report.alert_comment_url}`);
          }
          lines.push('');
          if (Array.isArray(report.findings) && report.findings.length > 0) {
            lines.push('Top findings:');
            for (const finding of report.findings.slice(0, 5)) {
              lines.push(`- \`${finding.repo}\` / \`${finding.workflow}\`: ${finding.consecutive_failures} consecutive failures`);
            }
          } else {
            lines.push('No workflow streaks crossed the threshold in this run.');
          }

          fs.appendFileSync(summaryPath, `${lines.join('\n')}\n`);
          NODE

      - name: Fail when threshold exceeded
        if: always()
        env:
          MONITOR_OUTCOME: ${{ steps.monitor.outcome }}
        run: |
          if [ "${MONITOR_OUTCOME}" = "failure" ]; then
            echo "Plugin health monitor execution failed"
            exit 1
          fi

          if [ -f profile/plugin-health-report.json ]; then
            node <<'NODE'
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('profile/plugin-health-report.json', 'utf8'));
            const count = Number(report.findings_count || 0);
            console.log(`findings_count=${count}`);
            if (count >= 1) {
              console.error('Detected workflow failure streak >= 10');
              process.exit(1);
            }
            NODE
          fi
