name: Plugin Health Monitor (TypeScript)
on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 6 UTC
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
        working-directory: plugin-health-monitor
      - run: npx tsx src/monitor.ts
        working-directory: plugin-health-monitor
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
