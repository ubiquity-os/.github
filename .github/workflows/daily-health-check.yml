name: Daily Plugin Health Check

on:
  schedule:
    - cron: '0 0 * * *' # Every day at midnight UTC
  workflow_dispatch: # Allow manual triggering for testing

jobs:
  health-check:
    name: Monitor Marketplace Plugins
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Health Monitor Script
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const healthMonitor = require('./scripts/health-monitor.js');
            await healthMonitor({ github, context, core });
